[project]
name = "icontract-hypothesis"
version = "1.1.9"
description = "An integration between icontract for design-by-contract and Hypothesis for property-based testing."
readme = "README.rst"
authors = [
    { name = "Marko Ristin", email = "marko@ristin.ch" },
    { name = "krageon", email = "git@voor.money" },
]
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["design-by-contract", "contracts", "automatic", "testing", "property-based"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: Hypothesis",
]
dependencies = [
    "hypothesis>=6.31.6",
    "icontract>=2.7.3",
]

[project.urls]
Homepage = "https://github.com/mristin/icontract-hypothesis"

[project.scripts]
pyicontract-hypothesis = "icontract_hypothesis.pyicontract_hypothesis.main:entry_point"

[project.entry-points.hypothesis]
_ = "icontract_hypothesis"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=4.5.1",
    "docutils>=0.19",
    "pygments>=2",
    "pytest>=7.0.1",
    "ruff>=0.17.5",
    "ty>=0.0.105",
]

[tool.ruff]
extend-exclude = ["test_samples/pyicontract_hypothesis/expected_ghostwrites"]

[tool.ruff.lint]
extend-ignore = ["FA100"]

[tool.ruff.lint.per-file-ignores]
"src/icontract_hypothesis/pyicontract_hypothesis/*" = ["BLE001"]
"tests/**" = ["S102", "PLC3002", "PYI034"]
"tests_3_7/**" = ["PYI034"]
